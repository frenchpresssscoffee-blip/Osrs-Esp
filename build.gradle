plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = '1.12.22.1'
def pluginMainClass = 'com.example.EspPluginLauncher'
def runeLiteSideloadDir = file("${System.properties['user.home']}/.runelite/sideloaded-plugins")

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.example'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	doFirst {
		def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
		def executableSuffix = isWindows ? '.exe' : ''
		def configuredJavaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
		def configuredJava = file("${configuredJavaHome}/bin/java${executableSuffix}")
		if (!configuredJava.exists()) {
			throw new GradleException("The run task could not find java at ${configuredJava}. Set JAVA_HOME to a valid JDK before running the launcher.")
		}

		executable = configuredJava.absolutePath
	}

	jvmArgs "-ea", "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
	args "--insecure-write-credentials"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.runtimeClasspath
	manifest {
		attributes('Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from {
		configurations.runtimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

tasks.register('installSideloadedPlugin', Copy) {
	dependsOn tasks.named('jar')
	description = 'Copies the thin plugin JAR into RuneLite sideloaded-plugins.'
	group = BasePlugin.BUILD_GROUP
	from(tasks.named('jar').flatMap { it.archiveFile })
	into(runeLiteSideloadDir)

	doFirst {
		runeLiteSideloadDir.mkdirs()
	}

	doLast {
		println "Installed ${tasks.jar.archiveFileName.get()} to ${runeLiteSideloadDir}"
		println "Launch RuneLite with --developer-mode to load sideloaded plugins."
	}
}
